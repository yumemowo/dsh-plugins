name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 必须先于 setup-node：cache: pnpm 要求 pnpm 已在 PATH 中。
      # 版本从根 package.json 的 packageManager 读取，不在此处写死。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 取 24 线最新版：下面要装全局 dsh，而 dsh 0.2.2 起要求 node >=24.9.0
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # verify:mount 调用真实的 dsh 启动器，校验构建产物能被挂载
      # 包名不带 tag 是有意的：这样 node 版本不满足 dsh 的 engines 会当场失败，
      # 带 @tag 时 npm 只告警 EBADENGINE 并照样安装，失配要到运行期才暴露。
      # 失败时报的是 ETARGET 而非「node 太旧」，别加 @latest 绕过它
      - run: npm install --global @deepseek-ai/dsh

      - run: pnpm run check
