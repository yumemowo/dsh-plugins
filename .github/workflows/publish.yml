name: Publish

# 版本号由人手动 bump，没有任何自动改版本的机器人。
#
# 两条发布入口，共用同一套判定（scripts/resolve-release-targets.mjs）：
#  1. 推送 tag，形态 <包目录名>@<版本>，例如 dsh-workspace-plus@0.1.1
#     —— 只判定该 tag 指定的包；
#  2. 手动触发（Actions 页面 Run workflow）
#     —— 判定全部可发布包，按 registry 状态决定谁该发。
# 判定规则：非预发布版、且该版本不在 registry 上。
on:
  push:
    tags:
      - '*@*'
  workflow_dispatch:

permissions:
  contents: read
  # OIDC 换 npm 短期 token 与 sigstore provenance 都依赖它
  id-token: write

jobs:
  # 先算出该发哪些包，后续每个包一个 job 并发执行，互不牵连
  targets:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.resolve.outputs.packages }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      # 必须先于 setup-node：cache: pnpm 要求 pnpm 已在 PATH 中。
      # 版本从根 package.json 的 packageManager 读取，不在此处写死。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 与 ci.yml 用同一个运行时
          node-version: '22.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve release targets
        id: resolve
        run: node scripts/resolve-release-targets.mjs

  publish:
    needs: targets
    if: needs.targets.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      # 一个包失败不牵连其它包，便于单独重跑
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.targets.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # verify:mount 调用真实的 dsh 启动器，校验构建产物能被挂载。
      # 只校验本 job 要发布的包：矩阵里每个包各跑一次，全量会把无关包重复校验 N 遍。
      - run: npm install --global @deepseek-ai/dsh

      # 只构建本 job 要发布的包及其工作区依赖：矩阵里每个包各跑一次，
      # 全量构建会重复编译无关包。`...` 后缀把该包自身的依赖一并纳入。
      - run: pnpm --filter "${{ matrix.package.name }}..." run build
      - run: pnpm --filter "${{ matrix.package.name }}" run typecheck
      - run: pnpm --filter "${{ matrix.package.name }}" run test
      - run: pnpm run verify:compat
      - run: node scripts/verify-profile-mount.mjs --only "${{ matrix.package.dir }}"

      # checkout tag 是游离 HEAD，pnpm 的默认 git 检查要求处于发布分支，故关闭
      - name: Publish ${{ matrix.package.name }}
        run: pnpm --filter "${{ matrix.package.name }}" publish --access public --provenance --no-git-checks
