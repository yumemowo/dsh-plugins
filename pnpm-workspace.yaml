# 工作区布局：packages/ 下每个目录都是一个独立版本的 dsh 插件包。
packages:
  - packages/*

# 所有插件开发期版本号的唯一来源。
# 各包用 `"typescript": "catalog:"` 引用，而不是各自硬编码范围，
# 因此升级工具链版本只需改这里一行。
catalog:
  # Cordis 是插件运行时。务必使用带 scope 的 @deepseek-ai/cordis：
  # 不带 scope 的 `cordis` 是另一份模块身份，会破坏 Context 类型增强
  #（ctx.tools 等类型会消失）。
  '@deepseek-ai/cordis': ~4.0.4
  '@deepseek-ai/dsh-llm': ^0.2.0-rc.2
  '@deepseek-ai/dsh-system-prompt': ^0.2.0-rc.2
  '@deepseek-ai/dsh-tools': ^0.2.0-rc.2
  '@deepseek-ai/schemastery': ^3.18.4
  '@types/node': ^26.5.1
  typescript: ^5.9.3
  vitest: ^5.0.0
  # scripts/verify-plugin-compat.mjs 用它判定 peer 范围是否接受最低 dsh 版本。
  # 与 dsh 自身同一套实现，避免校验语义和宿主漂移。
  semver: ^7.8.5

  # 浏览器半边：客户端包与 Web shell 共享同一份运行时实例，
  # 因此 React 必须与 shell 基线一致（18.x），否则会出现两个 React 实例。
  '@deepseek-ai/dsh-api-workspace-controller': ^0.2.0-rc.2
  '@deepseek-ai/dsh-api-session-controller': ^0.2.0-rc.2
  '@deepseek-ai/dsh-client-locale': ^0.2.0-rc.2
  '@deepseek-ai/dsh-client-store': ^0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-renderer': ^0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-session': ^0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-sidebar': ^0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-slots': ^0.2.0-rc.2
  # 只取类型：本包复用官方 workspace 语言包与 ctx.uiWorkspace 服务，
  # 需要官方的命名空间声明与动作契约，运行期由宿主解析、不打进产物。
  '@deepseek-ai/dsh-client-ui-workspace': ^0.2.0-rc.2
  # 只取类型：对照模式注册进官方原生右侧栏，需要 tab 类型契约与
  # `sidebar.right.pane.tab` 的插槽声明，运行期同样由宿主解析。
  '@deepseek-ai/dsh-client-ui-sidebar-right': ^0.2.0-rc.2
  '@deepseek-ai/dsh-session': ^0.2.0-rc.2
  '@deepseek-ai/dsh-storage-domain': ^0.2.0-rc.2
  '@types/react': ~18.3.1
  # 组件内聚样式后类名拼接用官方同一套（web-styling 规定 CSS Modules + clsx）
  # 它不是平台基线模块，会被打进产物
  clsx: ^2.1.1
  esbuild: ^0.28.2
  # 组件级 .module.css 的编译期（类名哈希 + :global 支持），由 build-client.mjs 调用
  lightningcss: ^1.33.0
  react: ^18.2.0
  # 与 dsh-storage-domain 的依赖线一致。刻意钉住具体版本：pnpm 11 的
  # minimumReleaseAge 门禁（24 小时）会拒绝刚发布的版本，浮动范围会在
  # 上游发版后突然让安装失败。
  zod: 4.6.2

# pnpm 11 默认拒绝安装刚发布的包（24 小时冷静期）。这份列表留空，
# 需要放行具体版本时再逐条添加。
minimumReleaseAgeExclude: []

# 强制全工作区使用同一份 zod。dsh-storage-domain 的 zod 范围是 ^4.4.3，
# 浮动解析会取到刚发布的版本，进而撞上上面的冷静期门禁；钉住一个已过
# 门禁的版本可以让安装可复现。
overrides:
  zod: 4.6.2

# pnpm 11 从本文件读取 storeDir / cacheDir，而不是从 .npmrc 读取。
# 指向工作区内可让 store 与 cache 随仓库自包含，不写则回落到 pnpm 默认的
# 全局位置（~/.local/share/pnpm）。
storeDir: .pnpm-store
cacheDir: .pnpm-cache
allowBuilds:
  # esbuild 需要执行安装脚本落地平台二进制；pnpm 11 默认拦截。
  esbuild: true
